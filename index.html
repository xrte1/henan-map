<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>豫 · 风土方舆 — 河南县域 2.5D 俯瞰图鉴</title>
<style>
:root{
  --ink:#eaf0fb; --ink-dim:rgba(234,240,251,.62); --ink-faint:rgba(234,240,251,.38);
  --gold:#ffd98a; --gold-deep:#e8ae4c; --glass-line:rgba(255,255,255,.16);
  --panel-w:236px; --detail-w:318px; --bar-h:62px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;margin:0;}
body{
  font:14px/1.65 "Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  color:var(--ink); overflow:hidden; background:#04060d;
}
/* ---------- deep imperial backdrop ---------- */
.bg{position:fixed; inset:0; z-index:0; overflow:hidden; background:
  radial-gradient(120% 90% at 50% -10%, #101c38 0%, #070b18 46%, #04060d 100%);}
.bg i{position:absolute; border-radius:50%; filter:blur(70px); opacity:.5; mix-blend-mode:screen;}
.bg .b1{width:46vw;height:46vw;left:-12vw;top:-14vw;background:radial-gradient(circle,#14315e,transparent 65%); animation:drift1 26s ease-in-out infinite alternate;}
.bg .b2{width:40vw;height:40vw;right:-10vw;top:22vh;background:radial-gradient(circle,#341d5c 0%,#1a2f55 45%,transparent 70%); opacity:.42; animation:drift2 32s ease-in-out infinite alternate;}
.bg .b3{width:34vw;height:26vh;left:20vw;bottom:-18vh;background:radial-gradient(ellipse at center,#3c2c10,transparent 70%); opacity:.5; animation:drift1 40s ease-in-out infinite alternate-reverse;}
.bg .stars{position:absolute;inset:0;background-image:
  radial-gradient(1px 1px at 12% 22%,rgba(255,255,255,.5),transparent),
  radial-gradient(1px 1px at 34% 8%,rgba(255,255,255,.34),transparent),
  radial-gradient(1.4px 1.4px at 62% 16%,rgba(255,215,138,.5),transparent),
  radial-gradient(1px 1px at 80% 5%,rgba(255,255,255,.4),transparent),
  radial-gradient(1px 1px at 90% 38%,rgba(255,255,255,.3),transparent),
  radial-gradient(1.2px 1.2px at 5% 60%,rgba(255,215,138,.35),transparent),
  radial-gradient(1px 1px at 70% 74%,rgba(255,255,255,.22),transparent);}

/* ---- 中华底蕴 · 河南文化背景装饰 ---- */
.bg .glyph{position:absolute; pointer-events:none; user-select:none; white-space:nowrap; line-height:1;
  font-family:"STKaiti","KaiTi","FZKai-Z03S","FangSong","STFangsong","STSong","SimSun",serif;
  color:rgba(245,205,130,.075); text-shadow:0 0 2px rgba(255,235,180,.03);}
.bg .g1{right:-2%; top:1%; font-size:38vh; opacity:.6; transform:rotate(2deg);}          /* 豫 */
.bg .g2{left:-3%; bottom:3%; font-size:30vh; opacity:.55; transform:rotate(-5deg);}     /* 鼎（青铜礼器·殷商） */
.bg .g3{top:13%; left:44%; font-size:24vh; opacity:.45;}                                 /* 中（天下之中） */
.bg .g4{right:28%; bottom:16%; font-size:6.5vh; opacity:.8; letter-spacing:2vw;}         /* 河洛 */
.bg .g5{left:10%; top:46%; font-size:13vh; opacity:.5; transform:rotate(-8deg);}         /* 嵩岳 */
.bg .g6{right:4%; top:45%; font-size:11vh; opacity:.5;}                                  /* 殷墟 */
.bg .moon{position:absolute; left:11%; top:15%; width:27vmin; height:27vmin; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle, rgba(255,226,160,.11), rgba(255,226,160,.035) 55%, transparent 72%);}
.bg .vtext{position:absolute; writing-mode:vertical-rl; text-orientation:mixed; pointer-events:none; user-select:none;
  font-family:"STKaiti","KaiTi","FZKai-Z03S","FangSong","STFangsong","STSong","SimSun",serif;
  color:rgba(255,218,140,.15); letter-spacing:.42em; font-size:16px; line-height:2.1;}
.bg .v1{left:6px; top:16%;}
.bg .v2{right:6px; bottom:14%;}
.bg .skyline{position:absolute; left:0; right:0; bottom:0; width:100%; height:136px; pointer-events:none;}
.bg .skyline .far{fill:rgba(255,216,140,.05);}
.bg .skyline .mid{fill:rgba(255,216,140,.08);}
.bg .skyline .tower{fill:rgba(240,196,120,.16);}
.bg .skyline .tower2{fill:rgba(240,196,120,.11);}
@keyframes drift1{from{transform:translate(0,0) scale(1);}to{transform:translate(6vw,4vh) scale(1.12);}}
@keyframes drift2{from{transform:translate(0,0) scale(1.05);}to{transform:translate(-7vw,6vh) scale(1);}}

/* ---------- glass ---------- */
.glass{
  position:relative;
  background:linear-gradient(155deg,rgba(255,255,255,.11),rgba(255,255,255,.045) 46%,rgba(255,255,255,.075));
  border:1px solid var(--glass-line);
  border-radius:16px;
  box-shadow:0 12px 34px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.20), inset 0 -1px 0 rgba(0,0,0,.25);
  backdrop-filter:blur(16px) saturate(160%); -webkit-backdrop-filter:blur(16px) saturate(160%);
}
.glass::before{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.10) 40%,rgba(255,255,255,.02) 52%,transparent 66%);
  opacity:.9;}
.glass>*{position:relative;}

#app{position:fixed; inset:0; z-index:1; display:flex; flex-direction:column; padding:10px; gap:10px;}
/* ---------- header ---------- */
header.bar{
  height:var(--bar-h); min-height:var(--bar-h); display:flex; align-items:center; gap:14px; padding:0 14px;
  overflow:hidden;
}
.brand{display:flex; align-items:center; gap:10px; white-space:nowrap;}
.brand .crest{width:34px;height:34px;flex:none; position:relative; border-radius:50%;
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.9), rgba(255,205,120,.9) 34%, rgba(200,140,40,.9) 62%, #7a4f12 100%);
  box-shadow:0 0 14px rgba(255,205,120,.45), inset 0 -2px 4px rgba(60,30,0,.5);}
.brand .crest::after{content:"豫"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:#2a1502; font-weight:700; font-size:16px; text-shadow:0 1px 0 rgba(255,255,255,.35);}
.brand h1{margin:0; font-size:17px; letter-spacing:1px; font-weight:600; line-height:1.2;}
.brand h1 small{display:block; font-size:11px; font-weight:400; color:var(--ink-dim); letter-spacing:2px;}
.head-stats{display:flex; gap:8px; margin-left:auto; align-items:stretch;}
.stat{display:flex; flex-direction:column; justify-content:center; padding:3px 12px; border-radius:12px; min-width:76px;
  background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02)); border:1px solid rgba(255,255,255,.10); text-align:center;}
.stat b{font-size:15px; color:var(--gold); font-weight:600; line-height:1.2; font-variant-numeric:tabular-nums;}
.stat span{font-size:10.5px; color:var(--ink-dim); letter-spacing:.5px;}
.head-actions{display:flex; gap:8px; margin-left:8px;}

/* ---------- buttons ---------- */
.tbtn{
  appearance:none; border:1px solid rgba(255,255,255,.20); border-radius:11px; cursor:pointer;
  color:var(--ink); background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
  padding:7px 13px; font-size:13px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16); transition:.16s;
}
.tbtn:hover{background:linear-gradient(160deg,rgba(255,215,138,.24),rgba(255,215,138,.08)); border-color:rgba(255,215,138,.55); color:#ffe7b0;}
.tbtn:active{transform:translateY(1px);}
.tbtn.gold{border-color:rgba(255,215,138,.5); background:linear-gradient(160deg,rgba(255,215,138,.32),rgba(232,174,76,.12)); color:#ffe9c2;}
.tbtn.ghost{background:transparent;}
.iconb{width:32px;height:32px;padding:0; justify-content:center;}

/* ---------- main ---------- */
main{flex:1; display:flex; gap:10px; min-height:0;}
aside.panel{flex:none; overflow:hidden; display:flex; flex-direction:column;}
#cityPanel{width:var(--panel-w);}
#detailPanel{width:var(--detail-w);}
.panel-head{display:flex; align-items:center; gap:8px; padding:12px 14px 9px; font-weight:600; letter-spacing:1px; font-size:14px;
  border-bottom:1px solid rgba(255,255,255,.10); color:var(--gold);}
.panel-head .x{margin-left:auto; cursor:pointer; opacity:.7;}
.panel-head .x:hover{opacity:1;}
.panel-body{flex:1; overflow:auto; padding:10px 12px; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.22) transparent;}
.panel-body::-webkit-scrollbar{width:5px;}
.panel-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2); border-radius:3px;}
.cityList{display:flex; flex-direction:column; gap:6px;}
.cityItem{display:flex; align-items:center; gap:9px; cursor:pointer; padding:8px 10px; border-radius:11px;
  border:1px solid transparent; transition:.15s;}
.cityItem:hover{background:rgba(255,255,255,.07);}
.cityItem.on{border-color:rgba(255,215,138,.5); background:rgba(255,215,138,.10);}
.cityItem .dot{width:9px;height:9px;border-radius:3px;flex:none; box-shadow:0 0 7px rgba(255,255,255,.25);}
.cityItem .nm{font-size:13px;}
.cityItem .ct{margin-left:auto; font-size:11px; color:var(--ink-faint); font-variant-numeric:tabular-nums;}
.panel-note{margin:10px 4px 2px; font-size:11px; color:var(--ink-faint); line-height:1.6;}

/* ---------- map ---------- */
#mapWrap{flex:1; min-width:0; position:relative;}
#mapStage{position:absolute; inset:0; border-radius:16px; overflow:hidden;
  backdrop-filter:none; -webkit-backdrop-filter:none; /* 大画布每帧重绘，避免大面积背景模糊卡顿 */
  touch-action:none; -webkit-touch-callout:none; user-select:none; -webkit-user-select:none;}
#cityPanel .panel-body,#detailPanel .panel-body{-webkit-overflow-scrolling:touch; overscroll-behavior:contain;}
#mapStage::after{content:""; position:absolute; left:12%; right:12%; bottom:-7%; height:16%; border-radius:50%;
  background:radial-gradient(ellipse at center, rgba(0,0,0,.55), transparent 68%); filter:blur(14px); pointer-events:none;}
#mapPersp{position:absolute; inset:0; perspective:1700px; perspective-origin:50% 30%;}
#plane{position:absolute; inset:0; transform-style:preserve-3d; transform:rotateX(27deg); transition:transform .25s ease-out; will-change:transform;}
#svg{display:block; width:100%; height:100%; overflow:visible;}
.cnty{cursor:pointer; fill:var(--c); stroke:rgba(255,255,255,.34); stroke-width:1; vector-effect:non-scaling-stroke;
  transition:filter .14s, stroke .14s;}
.cnty:hover{filter:brightness(1.22) drop-shadow(0 0 5px rgba(255,205,120,.85)); stroke:#ffe9b6; stroke-width:1.7;}
.cnty.sel{filter:brightness(1.3) drop-shadow(0 0 9px rgba(255,205,120,1)); stroke:#fff3cf; stroke-width:2;}

/* ---- 移动 / 平板适配：无悬停设备去掉重滤镜与玻璃模糊（消除点击闪黑），保留描边高亮 ---- */
@media (hover:none), (pointer:coarse){
  .cnty:hover{filter:none; stroke:#ffe9b6; stroke-width:2;}
  .cnty.sel{filter:none; stroke:#fff3cf; stroke-width:2.6;}
  .glass{backdrop-filter:none; -webkit-backdrop-filter:none;}
  .lmark:hover{filter:none;}
}
@media (max-width:700px){
  #floatCard{width:min(290px,88vw);}
  .layerCtl{max-width:74%;}
  .brand h1{font-size:15px;}
  .brand .crest{width:30px;height:30px;}
  footer.bar span:first-child{display:none;}
}
.mapLabel{pointer-events:none; font-size:15px; font-weight:600; fill:#fff; paint-order:stroke; stroke:rgba(0,0,0,.75); stroke-width:3.5px; letter-spacing:1px;}
.mapLabel.sub{font-size:11.5px; font-weight:400; fill:rgba(255,255,255,.8);}
.pinMark{pointer-events:none;}
.pinMark circle{fill:none; stroke:var(--gold); stroke-width:2; transform-box:fill-box; transform-origin:center;}
.pinMark .ring{animation:pulse 2.2s ease-out infinite;}
.pinMark .core{fill:#ffd98a; stroke:none;}
@keyframes pulse{0%{transform:scale(.6);opacity:.95;}100%{transform:scale(2.6);opacity:0;}}

#zoomCtl{position:absolute; left:14px; bottom:14px; display:flex; flex-direction:column; gap:6px; z-index:5;}
#zoomCtl .tbtn{width:34px;height:34px;padding:0;font-size:17px;justify-content:center;}
#hintChip{position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:5; padding:5px 14px; border-radius:999px;
  font-size:12px; letter-spacing:2px; color:var(--ink-dim); background:rgba(6,9,18,.35); border:1px solid rgba(255,255,255,.10);
  backdrop-filter:blur(8px); white-space:nowrap; transition:.25s; opacity:0; pointer-events:none;}
#hintChip.show{opacity:1;}

/* search box */
#searchWrap{position:absolute; top:12px; left:14px; z-index:14; width:250px;}
#searchWrap .sicon{position:absolute; left:11px; top:50%; transform:translateY(-50%); font-size:13px; opacity:.75; pointer-events:none;}
#searchWrap input{width:100%; padding:8px 10px 8px 30px; font:inherit; font-size:13px; color:var(--ink);
  border-radius:11px; border:1px solid var(--glass-line); outline:none;
  background:rgba(8,12,24,.62); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  box-shadow:0 6px 18px rgba(0,0,0,.35); transition:border-color .15s, background .15s;}
#searchWrap input::placeholder{color:var(--ink-faint);}
#searchWrap input:focus{border-color:rgba(255,215,138,.65); background:rgba(10,14,30,.85);}
#searchDrop{display:none; position:absolute; top:calc(100% + 6px); left:0; right:0; max-height:300px; overflow:auto;
  background:linear-gradient(165deg,rgba(18,24,44,.95),rgba(7,11,22,.97));
  border:1px solid var(--glass-line); border-radius:12px;
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  box-shadow:0 16px 40px rgba(0,0,0,.55); scrollbar-width:thin;}
#searchDrop.open{display:block;}
.sItem{display:flex; align-items:baseline; gap:8px; padding:8px 12px; cursor:pointer; font-size:13px;}
.sItem .nm{white-space:nowrap;}
.sItem .city{margin-left:auto; font-size:11px; color:var(--ink-faint); flex:none;}
.sItem:hover,.sItem.on{background:rgba(255,215,138,.14);}
.sEmpty{padding:10px 12px; color:var(--ink-faint); font-size:12px;}

/* scenic spots & history layers */
.layerCtl{position:absolute; top:12px; right:14px; z-index:14; display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; max-width:56%;}
.layerCtl .tbtn{padding:5px 10px; font-size:12px; border-radius:10px;}
#scenBtn{position:static;}
#scenBtn.on{color:#ffe7b0;}
.tbtn.on{border-color:rgba(255,215,138,.55); color:#ffe7b0; background:linear-gradient(160deg,rgba(255,215,138,.28),rgba(255,215,138,.08));}
.layer.hide, #scenG.hide{display:none;}
#scenG .smark{cursor:pointer;}
#scenG .halo{fill:rgba(255,215,138,.16); stroke:rgba(255,215,138,.9); stroke-width:1.2;}
#scenG .core{fill:#ffd98a; stroke:#7a5410; stroke-width:.6;}
#scenG .smark:hover .halo{fill:rgba(255,224,160,.38); stroke:#fff3cf;}
.lmark{cursor:pointer;}
.markRect{fill:var(--c2,transparent); stroke:var(--c1,#fff); stroke-width:1.3;}
.markRectIn{fill:var(--c1,#fff);}
.markCircle{fill:var(--c2,transparent); stroke:var(--c1,#fff); stroke-width:1.3;}
.markDiamond{fill:var(--c2,transparent); stroke:var(--c1,#fff); stroke-width:1.3;}
.markDiamondCore{fill:var(--c1,#fff);}
.lmark:hover{filter:brightness(1.6);}
#spotTip{position:absolute; z-index:22; display:none; padding:4px 11px; border-radius:9px; font-size:12px; color:#ffe9c2;
  border:1px solid rgba(255,215,138,.5); background:rgba(9,12,24,.9);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  box-shadow:0 6px 18px rgba(0,0,0,.45); pointer-events:none; white-space:nowrap;}
#spotTip .tag{margin-left:7px; color:var(--ink-faint); font-size:10.5px;}
.scenList{display:flex; flex-direction:column; gap:6px; width:100%;}
.scItem{display:flex; gap:8px; align-items:baseline; padding:6px 9px; border-radius:9px; cursor:pointer; font-size:12px;
  border:1px solid rgba(255,215,138,.24); background:linear-gradient(150deg,rgba(255,215,138,.12),rgba(255,215,138,.03)); transition:.15s;}
.scItem:hover{background:rgba(255,215,138,.22); border-color:rgba(255,215,138,.6);}
.scItem .no{color:var(--gold-deep); font-size:11px; font-weight:600;}
.scItem .nm{color:#ffe7c0;}
.scItem .tg{margin-left:auto; color:var(--ink-faint); font-size:10px; flex:none;}

/* floating glass card near cursor */
#floatCard{position:absolute; z-index:20; width:296px; padding:0; opacity:0; transform:scale(.96) translateY(4px);
  pointer-events:none; transition:opacity .14s, transform .14s;}
#floatCard.show{opacity:1; transform:scale(1) translateY(0);}
.fc-body{padding:12px 13px 13px;}
.fc-title{display:flex; align-items:baseline; gap:8px; margin-bottom:6px;}
.fc-title h3{margin:0; font-size:17px; color:#fff; letter-spacing:1px;}
.fc-title .pill{margin-left:auto;}
.pill{font-size:10.5px; padding:2px 9px; border-radius:999px; border:1px solid rgba(255,255,255,.22); color:var(--ink-dim); white-space:nowrap; background:rgba(255,255,255,.05);}
.pill.hot{border-color:rgba(255,215,138,.45); color:#ffe3a3;}
.fc-line{font-size:12px; color:var(--ink-dim); margin:5px 0; display:flex; gap:6px;}
.fc-line .lb{flex:none; width:52px; color:var(--ink-faint);}
.fc-line.clamped .v{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.fc-cult{font-size:12px; color:rgba(255,255,255,.86); line-height:1.7;}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.chips .chip{font-size:11.5px; padding:2.5px 9px; border-radius:8px; background:linear-gradient(150deg,rgba(255,215,138,.20),rgba(255,215,138,.06)); border:1px solid rgba(255,215,138,.30); color:#ffe7c0;}
.fc-hint{margin-top:8px; font-size:10.5px; color:var(--ink-faint); display:flex; justify-content:space-between;}

/* detail */
.dhero{padding:2px 2px 12px; border-bottom:1px dashed rgba(255,255,255,.12); margin-bottom:10px;}
.dhero h3{margin:0 0 2px; font-size:22px; color:#fff; letter-spacing:3px; display:flex; align-items:baseline; gap:10px;}
.dhero .sub{font-size:12px; color:var(--ink-dim); letter-spacing:1px;}
.drow{display:flex; gap:8px; margin:8px 0;}
.drow .lb{flex:none; font-size:12px; color:var(--gold-deep); padding-top:2px; width:56px; letter-spacing:1px;}
.drow .v{font-size:13px; color:rgba(255,255,255,.92);}
.drow .v.long{line-height:1.85; font-size:12.8px;}
.empty-tip{padding:18px 10px; text-align:center; color:var(--ink-faint); font-size:12.5px; line-height:2;}
.empty-tip .big{font-size:30px; display:block; margin-bottom:6px; opacity:.8;}
.dacts{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}

footer.bar{min-height:26px; display:flex; align-items:center; gap:14px; padding:0 14px; font-size:11px; color:var(--ink-faint);}
footer .sep{flex:1;}
footer b{color:var(--ink-dim); font-weight:600;}
kbd{border:1px solid rgba(255,255,255,.25); border-radius:5px; padding:0 5px; font-size:10px;}

/* intro overlay */
#intro{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; background:radial-gradient(80% 70% at 50% 40%, #0a0f20, #04060d 80%); transition:opacity .8s; pointer-events:none;}
#intro .box{text-align:center;}
#intro .big{font-size:56px; line-height:1;}
#intro h2{margin:14px 0 4px; letter-spacing:10px; font-weight:600; font-size:26px; text-indent:10px;}
#intro p{margin:0; color:var(--ink-dim); letter-spacing:3px; font-size:12.5px;}
#intro.off{opacity:0;}

/* drawers on small screens */
.drawBtn{display:none; position:absolute; top:50%; transform:translateY(-50%); z-index:9; width:30px;height:52px; padding:0;
  border-radius:10px; font-size:14px; color:var(--ink-dim);}
.drawBtn.l{left:0;}
.drawBtn.r{right:0;}

@media (max-width:1180px){
  :root{--panel-w:222px; --detail-w:286px;}
  .head-stats .stat{display:none;}
  .head-stats .stat:nth-child(-n+2){display:flex;}
}
@media (max-width:980px){
  #cityPanel,#detailPanel{position:absolute; top:72px; bottom:10px; z-index:30; transition:transform .25s ease; box-shadow:0 18px 46px rgba(0,0,0,.5);}
  #cityPanel{left:10px; transform:translateX(-130%);}
  #detailPanel{right:10px; transform:translateX(130%);}
  #cityPanel.open,#detailPanel.open{transform:translateX(0);}
  #cityPanel{width:min(240px,78vw);}
  #detailPanel{width:min(300px,82vw);}
  .drawBtn{display:flex;}
  .head-stats{display:none;}
  .brand h1 small{display:none;}
}
</style>
</head>
<body>
<div class="bg">
  <i class="b1"></i><i class="b2"></i><i class="b3"></i>
  <div class="stars"></div>
  <div class="moon"></div>
  <span class="glyph g1">豫</span>
  <span class="glyph g2">鼎</span>

/* ---------- viewbox / camera ---------- */
function cw(){ return stage.clientWidth || 600; }
function ch(){ return stage.clientHeight || 420; }
function applyVB(){ svg.setAttribute('viewBox', state.vb.x+' '+state.vb.y+' '+state.vb.w+' '+state.vb.h); }

function fitBox(box, pad, animMs){
  pad = pad == null ? 0.08 : pad;
  const ar = ch() / cw();
  const x0=box[0], y0=box[1], x1=box[2], y1=box[3];
  const spanX = (x1 - x0) * (1 + 2*pad) || 1;
  const spanY = (y1 - y0) * (1 + 2*pad) || 1;
  let w = Math.max(spanX, spanY / ar);
  let h = w * ar;
  const cx0 = (x0 + x1) / 2, cy0 = (y0 + y1) / 2;
  const to = { x: cx0 - w/2, y: cy0 - h/2, w, h };
  if (animMs) tween(to, animMs); else { cancelZoom(); Object.assign(state.vb, to); state.ar = ar; applyVB(); }
}

function fitAll(animMs){ fitBox([0, 0, META.W, META.H], 0.10, animMs); }
function boxOfPref(ci){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for (let i=0;i<N;i++){ if (META.ci[i]!==ci) continue;
    const b=META.bb[i];
    if(b[0]<x0)x0=b[0]; if(b[1]<y0)y0=b[1]; if(b[2]>x1)x1=b[2]; if(b[3]>y1)y1=b[3];
  }
  return x0>1e8 ? null : [x0,y0,x1,y1];
}

function tween(to, ms){
  cancelZoom();
  const from = { x:state.vb.x, y:state.vb.y, w:state.vb.w, h:state.vb.h };
  const t0 = performance.now(), tok = ++state.animToken;
  function step(t){
    if (tok !== state.animToken) return;
    const k = Math.min(1, (t - t0) / ms);
    const e = 1 - Math.pow(1 - k, 3);
    state.vb.x = from.x + (to.x - from.x) * e;
    state.vb.y = from.y + (to.y - from.y) * e;
    state.vb.w = from.w + (to.w - from.w) * e;
    state.vb.h = from.h + (to.h - from.h) * e;
    applyVB();
    if (k < 1) requestAnimationFrame(step); else state.ar = state.vb.h / state.vb.w;
  }
  requestAnimationFrame(step);
}

function focusCounty(i, pad, ms){
  const b = META.bb[i];
  const spanX = b[2]-b[0], spanY = b[3]-b[1];
  const padX = Math.max(spanX * pad, 150), padY = Math.max(spanY * pad, 150);
  fitBox([b[0]-padX, b[1]-padY, b[2]+padX, b[3]+padY], 0, ms || 800);
}
function focusPref(ci, ms){ const b = boxOfPref(ci); if (b) fitBox(b, 0.16, ms || 800); }

/* ---------- camera mapping / zoom ---------- */
const Z_MIN = META.W / 16, Z_MAX = META.W * 3;
let zoomTok = 0;
function cancelZoom(){ zoomTok++; }
function setVBCenterW(nw){
  // 以视口中心为锚缩放：规避 3D 倾斜下指针坐标→地图坐标的映射误差（漂移根源），
  // 同时保证每帧只改一次 viewBox，降低重绘开销
  nw = Math.min(Math.max(nw, Z_MIN), Z_MAX);
  const cx0 = state.vb.x + state.vb.w / 2;
  const cy0 = state.vb.y + state.vb.h / 2;
  state.vb.w = nw;
  state.vb.h = nw * (ch() / cw());
  state.vb.x = cx0 - state.vb.w / 2;
  state.vb.y = cy0 - state.vb.h / 2;
  state.ar = state.vb.h / state.vb.w;
  applyVB();
}
function zoomTo(f){
  cancelZoom(); hideSpotTip();
  const target = Math.min(Math.max(state.vb.w / f, Z_MIN), Z_MAX);
  if (Math.abs(target - state.vb.w) < 0.5) return;
  const tok = ++zoomTok;
  const frame = () => {
    if (tok !== zoomTok) return;
    const cur = state.vb.w;
    const next = cur + (target - cur) * 0.32; // 指数缓动，逐帧收敛到目标
    if (Math.abs(target - cur) < 0.6){ setVBCenterW(target); return; }
    setVBCenterW(next);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
function onWheel(e){
  e.preventDefault();
  const f = Math.min(Math.max(Math.pow(1.9, -e.deltaY / 100), 0.6), 1.75); // 单次滚轮步长限幅
  zoomTo(f);
}
/* ---------- pointer / pan / zoom / 触摸手势 ---------- */
let downPt = null, downVB = null;
const pointers = new Map();   // 活动触点（支持双指捏合缩放）
let pinch = null;             // 捏合状态
let pinchGuard = 0;           // 捏合结束后短暂屏蔽“误触点击”
function countyUnder(e){
  let t0 = e.target, ti = NaN;
  while (t0 && t0 !== svg){
    if (t0.dataset && t0.dataset.i != null){ ti = parseInt(t0.dataset.i, 10); break; }
    t0 = t0.parentNode;
  }
  return Number.isFinite(ti) ? ti : (state.hoverIdx >= 0 ? state.hoverIdx : -1);
}
function onDown(e){
  if (state.touring) stopTour(false);
  if (!(e.button === 0 || e.pointerType === 'touch' || e.pointerType === 'pen')) return;
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  svg.setPointerCapture && svg.setPointerCapture(e.pointerId);
  cancelZoom();
  if (pointers.size >= 2){           // 第二根手指落下 → 进入双指捏合
    state.dragging = false; state.dragMoved = false; downPt = null;
    const p = [...pointers.values()];
    pinch = {
      d0: Math.max(1, Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y)),
      cx: (p[0].x + p[1].x) / 2, cy: (p[0].y + p[1].y) / 2,
      w0: state.vb.w,
      ux: state.vb.x + state.vb.w / 2, uy: state.vb.y + state.vb.h / 2
    };
    return;
  }
  pinch = null; pinchGuard = 0;
  state.dragging = true; state.dragMoved = false;
  state._downCounty = countyUnder(e);
  downPt = { x:e.clientX, y:e.clientY };
  downVB = { x:state.vb.x, y:state.vb.y };
}
function onMove(e){
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pinch){                       // 双指捏合：缩放 + 双指平移
    const p = [...pointers.values()];
    if (p.length >= 2){
      const d = Math.max(1, Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y));
      const mx = (p[0].x + p[1].x) / 2, my = (p[0].y + p[1].y) / 2;
      const nw = Math.min(Math.max(pinch.w0 * pinch.d0 / d, Z_MIN), Z_MAX);
      const dxu = (mx - pinch.cx) * (nw / cw());
      const dyu = (my - pinch.cy) * (nw / ch());
      state.vb.w = nw;
      state.vb.h = nw * (ch() / cw());
      state.vb.x = pinch.ux + dxu - state.vb.w / 2;
      state.vb.y = pinch.uy + dyu - state.vb.h / 2;
      state.ar = state.vb.h / state.vb.w;
      applyVB(); hideSpotTip();
      return;
    }
  }
  if (state.dragging && downPt){
    const dx = e.clientX - downPt.x, dy = e.clientY - downPt.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) state.dragMoved = true;
    state.vb.x = downVB.x - dx * state.vb.w / cw();
    state.vb.y = downVB.y - dy * state.vb.h / ch();
    applyVB();
    hideSpotTip();
    return;
  }
  // parallax tilt follow pointer（仅鼠标悬停等无触点场景）
  if (e.pointerType && e.pointerType !== 'mouse') return;
  const r = stage.getBoundingClientRect();
  const nx = (e.clientX - r.left) / r.width - 0.5;
  const ny = (e.clientY - r.top) / r.height - 0.5;
  plane.style.transform = 'rotateX(' + (27 - ny * 5).toFixed(2) + 'deg) rotateZ(' + (nx * 1.4).toFixed(2) + 'deg)';
  moveFloat(e.clientX, e.clientY);
}
function onUp(e){
  pointers.delete(e.pointerId);
  if (pinch){                        // 捏合结束：防止剩余手指抬起被误判为点击
    if (pointers.size < 2){
      pinch = null;
      pinchGuard = Date.now();
      state.dragging = false; state.dragMoved = false; downPt = null;
    }
    return;
  }
  if (state.dragging && downPt){
    const d = Math.hypot(e.clientX - downPt.x, e.clientY - downPt.y);
    state.dragging = false;
    if (d < 8 && Date.now() - pinchGuard > 350){ // 轻点：聚焦县区 / 点空白复位
      const i = state._downCounty >= 0 ? state._downCounty : state.hoverIdx;
      if (i >= 0){
        selectCounty(i, true);
        if (state.selIdx === i) focusCounty(i, 0.18, 650); // 再次轻点同一县：进一步放大
      } else if (state.selIdx >= 0) clearSelect(false);
      else fitAll(650);
    }
  }
  downPt = null;
}

/* ---------- float card ---------- */
function buildContent(d){
  const h = document.createElement('div');
  h.className = 'fc-body';
  const spec = Array.isArray(d.s) ? d.s.slice(0,5) : [];
  let html = '<div class="fc-title"><h3></h3><span class="pill hot"></span></div>'
    + '<div class="fc-line"><span class="lb">人口</span><span class="v"></span></div>'
    + '<div class="fc-line clamped"><span class="lb">文化底蕴</span><span class="v fc-cult"></span></div>';
  if (spec.length) html += '<div class="chips"></div>';
  html += '<div class="fc-hint"><span>轻点聚焦 · 再点放大 · 点空白复位</span><span>滚轮缩放</span></div>';
  h.innerHTML = html;
  return h;
}
function renderInto(h, i){
  const d = dataOf(i), name = nameOf(i), city = cityOf(i);
  const t = h.querySelector('.fc-title h3'), pill = h.querySelector('.pill.hot'),
        vp = h.querySelector('.fc-line .v'), vc = h.querySelector('.fc-cult');
  t.textContent = name; pill.textContent = city;
  vp.textContent = d.p || '—';
  vc.textContent = d.c || '';
  const chips = h.querySelector('.chips');
  if (chips){ chips.innerHTML = ''; (Array.isArray(d.s)?d.s:[]).slice(0,5).forEach(s=>{
    const c = document.createElement('span'); c.className='chip'; c.textContent = s; chips.appendChild(c); }); }
}
function moveFloat(cx, cy){
  if (state.hoverIdx < 0 || state.touring) { hideFloat(); return; }
  const r = stage.getBoundingClientRect();
  let px = cx - r.left + 18, py = cy - r.top + 20;
  const fw = floatCard.offsetWidth || 296, fh = floatCard.offsetHeight || 200;
  if (px + fw > r.width - 8) px = cx - r.left - fw - 14;
  if (py + fh > r.height - 8) py = cy - r.top - fh - 10;
  if (py < 8) py = 8; if (px < 8) px = 8;
  floatCard.style.left = px + 'px';
  floatCard.style.top = py + 'px';
  floatCard.style.opacity = '1';
}
function showFloat(i){
  state.hoverIdx = i;
  floatCard.innerHTML = '';
  const h = buildContent({});
  floatCard.appendChild(h);
  renderInto(h, i);
  floatCard.classList.add('show');
}
function hideFloat(){
  state.hoverIdx = -1;
  floatCard.classList.remove('show');
  floatCard.style.opacity = '';
  if (state.selIdx < 0){ labelTxt.style.display='none'; labelSub.style.display='none'; }
  else updateLabel(state.selIdx);
}
function onCountyEnter(e){
  const i = +e.currentTarget.dataset.i;
  if (state.dragging && state.dragMoved) return;
  showFloat(i);
  updateLabel(i);
}
function onCountyLeave(){
  if (state.dragging && state.dragMoved) return;
  hideFloat();
}
function onCountyClick(e){
  if (state.dragging && state.dragMoved) return;
  if (performance.now() - (state._lastSel || 0) < 260) return; // 与 onUp 轻点聚焦去重
  const i = +e.currentTarget.dataset.i;
  selectCounty(i, true);
}
function onCountyDbl(e){
  if (state.dragging && state.dragMoved) return;
  const i = +e.currentTarget.dataset.i;
  selectCounty(i, false);
  focusCounty(i, 0.18, 750);
}

/* ---------- selection / detail ---------- */
function updateLabel(i){
  const d = dataOf(i);
  const c = { x: META.cx[i], y: META.cy[i] };
  labelTxt.setAttribute('x', c.x); labelTxt.setAttribute('y', c.y - 6);
  labelTxt.textContent = nameOf(i);
  labelTxt.style.display = '';
  labelSub.setAttribute('x', c.x); labelSub.setAttribute('y', c.y + 13);
  labelSub.textContent = (d.p || '');
  labelSub.style.display = '';
}
function selectCounty(i, soft){
  if (state.touring) stopTour(false);
  hideSpotTip();
  state.selIdx = i;
  state._lastSel = performance.now();
  state.pinCity = META.ci[i];
  gMain.querySelectorAll('.cnty.sel').forEach(p => p.classList.remove('sel'));
  gMain.children[i].classList.add('sel');
  renderDetail(i);
  gPin.style.display = '';
  const c = { x: META.cx[i], y: META.cy[i] };
  ring.setAttribute('cx', c.x); ring.setAttribute('cy', c.y);
  gPin.querySelectorAll('circle').forEach(cr => { cr.setAttribute('cx', c.x); cr.setAttribute('cy', c.y); });
  updateLabel(i);
  if (soft) focusCounty(i, 0.6, 700);
  setCityChips(META.ci[i]);
  if (window.matchMedia('(max-width:980px)').matches) $('#detailPanel').classList.add('open');
  hint('已钉选 ' + nameOf(i));
}
function clearSelect(soft){
  state.selIdx = -1; state.pinCity = -1;
  gMain.querySelectorAll('.cnty.sel').forEach(p => p.classList.remove('sel'));
  gPin.style.display = 'none';
  labelTxt.style.display='none'; labelSub.style.display='none';
  renderDetail(-1);
  if (!soft) { fitAll(900); setCityChips(-1); }
}
function renderDetail(i){
  detailBody.innerHTML = '';
  let d, name, sub, p, c, s, k;
  if (i < 0){ d = PROV; name = d.name; sub = d.sub; p = d.p; c = d.c; s = d.s; k = d.k; }
  else { d = dataOf(i); name = nameOf(i); sub = cityOf(i); p = d.p || ''; c = d.c || ''; s = d.s || []; k = d.k || ''; }
  const box = document.createElement('div');
  box.className = 'dhero';
  box.innerHTML = '<h3>' + esc(name) + '</h3><div class="sub">' + esc(i<0?'河南省 · 全域总览':sub) + '</div>';
  const body = document.createElement('div');
  let html = '<div class="drow"><span class="lb">人口</span><span class="v">' + esc(p) + '</span></div>'
    + '<div class="drow"><span class="lb">文化底蕴</span><span class="v long">' + esc(c) + '</span></div>';
  if (k) html += '<div class="drow"><span class="lb">文化名片</span><span class="v long">' + esc(k) + '</span></div>';
  if (Array.isArray(s) && s.length){
    html += '<div class="drow"><span class="lb">特产名产</span><span class="v"><div class="chips" style="margin-top:0"></div></span></div>';
  }
  const scn = (i >= 0 && SCEN[cityOf(i)]) ? SCEN[cityOf(i)] : [];
  if (scn.length){
    html += '<div class="drow" style="border-top:1px dashed rgba(255,255,255,.15); margin-top:8px; padding-top:9px; align-items:stretch"><span class="lb" style="padding-top:3px">代表景区</span><span class="v" style="flex:1; min-width:0"><div class="scenList"></div></span></div>';
  }
  html += '<div class="dacts">'
    + (i<0 ? '<button class="tbtn gold" id="dTour">&#9654; 开始俯瞰巡览</button><button class="tbtn ghost" id="dFit">适屏复位</button>'
           : '<button class="tbtn" id="dFocus">&#8982; 聚焦此县</button><button class="tbtn ghost" id="dClear">取消钉选</button>')
    + '</div>';
  body.innerHTML = html;
  if (Array.isArray(s) && s.length){
    const wrap = body.querySelector('.chips');
    s.forEach(x => { const c2 = document.createElement('span'); c2.className='chip'; c2.textContent = x; wrap.appendChild(c2); });
  }
  if (scn.length){
    const lst = body.querySelector('.scenList');
    if (lst){
      scn.forEach((sp, j) => {
        const it = document.createElement('div'); it.className = 'scItem';
        const no = document.createElement('span'); no.className = 'no'; no.textContent = (j + 1);
        const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = sp.n;
        const tg = document.createElement('span'); tg.className = 'tg'; tg.textContent = sp.t || '';
        it.appendChild(no); it.appendChild(nm); it.appendChild(tg);
        it.addEventListener('click', function(){
          const ci2 = idxByName[sp.k];
          if (ci2 != null){ selectCounty(ci2, true); focusCounty(ci2, 0.3, 800); }
        });
        lst.appendChild(it);
      });
    }
  }
  detailBody.appendChild(box);
  detailBody.appendChild(body);
  const act = body.querySelector('#dTour'), fitB = body.querySelector('#dFit'),
        foc = body.querySelector('#dFocus'), clr = body.querySelector('#dClear');
  if (act) act.onclick = () => { toggleTour(); };
  if (fitB) fitB.onclick = () => fitAll(900);
  if (foc && i>=0) foc.onclick = () => focusCounty(i, 0.3, 800);
  if (clr) clr.onclick = () => clearSelect(false);
}
function hint(t){
  hintChip.textContent = t;
  hintChip.classList.add('show');
  clearTimeout(hint._t);
  hint._t = setTimeout(() => hintChip.classList.remove('show'), 1800);
}

/* ---------- city chips ---------- */
const cityListEl = $('#cityList');
function setCityChips(activeCi){
  [...cityListEl.children].forEach(b => {
    b.classList.toggle('on', b.dataset.ci == activeCi);
  });
}
function buildCityChips(){
  cityListEl.innerHTML = '';
  const counts = new Array(META.prefs.length).fill(0);
  for (let i=0;i<N;i++) counts[META.ci[i]]++;
  META.prefs.forEach((nm, ci) => {
    const b = document.createElement('div');
    b.className = 'cityItem';
    b.dataset.ci = ci;
    b.innerHTML = '<span class="dot" style="background:' + PAL[ci % PAL.length] + '"></span>'
      + '<span class="nm">' + nm + '</span><span class="ct">' + counts[ci] + ' 区县</span>';
    b.onclick = () => {
      if (state.pinCity === ci){ clearSelect(false); return; }
      const box = boxOfPref(ci);
      if (box){ fitBox(box, 0.14, 850); setCityChips(ci); state.pinCity = ci; hint('州府 · ' + nm); }
    };
    cityListEl.appendChild(b);
  });
}

/* ---------- tour ---------- */
const TOUR_NAMES = ['登封市','龙亭区','洛龙区','汝州市','林州市','浚县','卫辉市','修武县','濮阳县','禹州市','舞阳县','灵宝市','内乡县','永城市','新县','淮阳区','遂平县','济源市'];
function toggleTour(){ state.touring ? stopTour(false) : startTour(); }
function startTour(){
  stopTour(true);
  state.touring = true;
  $('#btnTour').textContent = '\u2759\u2759 暂停巡览';
  $('#btnTour').classList.remove('gold');
  tourGo(0);
}
function tourGo(idx){
  if (!state.touring) return;
  const nm = TOUR_NAMES[idx % TOUR_NAMES.length];
  const i = META.names.indexOf(nm);
  if (i < 0) { stopTour(false); return; }
  selectCounty(i, false);
  focusCounty(i, 0.55, 1500);
  const self = state;
  clearTimeout(state.tourTimer);
  state.tourTimer = setTimeout(() => tourGo(idx + 1), 4600);
}
function stopTour(resetLabel){
  state.touring = false;
  clearTimeout(state.tourTimer);
  const b = $('#btnTour');
  b.textContent = '\u25B6 俯瞰巡览';
  b.classList.add('gold');
  if (resetLabel){ /* keep current */ }
}

/* ---------- interact wiring ---------- */
svg.addEventListener('pointerdown', onDown);
window.addEventListener('pointermove', onMove, {passive:true});
window.addEventListener('pointerup', onUp);
svg.addEventListener('pointercancel', onUp);
svg.addEventListener('contextmenu', e => e.preventDefault()); // 触屏长按不弹系统菜单
svg.addEventListener('wheel', onWheel, {passive:false});
svg.addEventListener('pointerleave', () => { hideFloat(); });

function wireCounties(){
  const kids = gMain.children;
  for (let i=0;i<kids.length;i++){
    const p = kids[i];
    p.addEventListener('pointerenter', onCountyEnter);
    p.addEventListener('pointerleave', onCountyLeave);
    p.addEventListener('click', onCountyClick);
    p.addEventListener('dblclick', onCountyDbl);
  }
}
wireCounties();

$('#zIn').onclick = () => zoomTo(1.5);
$('#zOut').onclick = () => zoomTo(1 / 1.5);
$('#zReset').onclick = () => fitAll(700);
$('#btnReset').onclick = () => { clearSelect(true); fitAll(900); };
$('#btnTour').onclick = toggleTour;
$('#btnHelp').onclick = () => hint('轻点县域聚焦 · 再点同县放大 · 点空白复位 · 滚轮缩放 · 拖拽平移');
document.querySelectorAll('#layerCtlWrap .tbtn, .layerCtl .tbtn').forEach(b => {
  b.addEventListener('click', function(){
    const g = layerMap[b.dataset.layer];
    if (!g) return;
    const hidden = g.classList.toggle('hide');
    b.classList.toggle('on', !hidden);
    hideSpotTip();
  });
});
svg.addEventListener('wheel', hideSpotTip);

/* ---------- 县城搜索框 ---------- */
(function(){
  const inp = document.getElementById('searchInput');
  const drop = document.getElementById('searchDrop');
  let cur = [];
  function hide(){ drop.classList.remove('open'); drop.innerHTML = ''; cur = []; }
  function pick(i){
    hide();
    inp.value = META.names[i];
    inp.blur();
    selectCounty(i, true);
  }
  function render(){
    const q = inp.value.trim();
    if (!q){ hide(); return; }
    const head = [], tail = [];
    for (let i = 0; i < N; i++){
      const n = META.names[i];
      if (n.indexOf(q) === 0) head.push(i);
      else if (n.indexOf(q) > 0) tail.push(i);
    }
    cur = head.concat(tail).slice(0, 10);
    drop.innerHTML = '';
    if (!cur.length){
      const d = document.createElement('div');
      d.className = 'sEmpty';
      d.textContent = '未找到「' + q + '」，请输入县 / 区 / 市全名';
      drop.appendChild(d);
    } else {
      cur.forEach(function(i){
        const it = document.createElement('div');
        it.className = 'sItem';
        const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = META.names[i];
        const cy = document.createElement('span'); cy.className = 'city'; cy.textContent = cityOf(i);
        it.appendChild(nm); it.appendChild(cy);
        it.onmousedown = function(ev){ ev.preventDefault(); pick(i); };
        it.onclick = function(){ pick(i); };
        drop.appendChild(it);
      });
    }
    drop.classList.add('open');
  }
  inp.addEventListener('input', render);
  inp.addEventListener('focus', function(){ if (inp.value.trim()) render(); });
  inp.addEventListener('blur', function(){ setTimeout(hide, 160); });
  inp.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ hide(); inp.blur(); e.stopPropagation(); }
    else if (e.key === 'Enter' && cur.length){ pick(cur[0]); e.preventDefault(); }
  });
})();
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => {
  $('#' + b.dataset.close).classList.remove('open');
});

/* drawers for narrow screens */
$('#drawL').onclick = () => { $('#cityPanel').classList.add('open'); };
$('#drawR').onclick = () => { $('#detailPanel').classList.add('open'); };
$('#cityPanel .x').onclick = () => $('#cityPanel').classList.remove('open');
$('#detailPanel .x').onclick = () => $('#detailPanel').classList.remove('open');

window.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return; // 输入框内按键由搜索框自行处理
  if (e.key === 'Escape'){ if (state.selIdx >= 0) clearSelect(false); }
});

let rsToken = 0;
window.addEventListener('resize', () => {
  clearTimeout(rsToken);
  rsToken = setTimeout(() => {
    cancelZoom();
    const cx0 = state.vb.x + state.vb.w/2, cy0 = state.vb.y + state.vb.h/2;
    const w = state.vb.w, ar = ch()/cw();
    state.vb.h = w * ar; state.vb.w = w;
    state.vb.x = cx0 - w/2; state.vb.y = cy0 - state.vb.h/2;
    state.ar = ar; applyVB();
  }, 120);
});

/* ---------- boot ---------- */
buildCityChips();
renderDetail(-1);
fitAll(0);
setTimeout(() => {
  document.querySelector('#intro').classList.add('off');
  hint('悬浮县域，俯瞰风物');
  // slight centered settle zoom-in
  const c = state.vb;
  tween({ x: c.x + c.w*0.05, y: c.y + c.h*0.05, w: c.w * 0.9, h: c.h * 0.9 }, 1400);
}, 900);
</script>
